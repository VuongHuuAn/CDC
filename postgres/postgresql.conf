# Runtime PostgreSQL cho CDC — sửa file rồi restart service pg-*

listen_addresses = '*'  # lắng nghe mọi interface trong container
port = 5432
wal_level = logical  # ghi WAL đủ chi tiết cho logical replication / Debezium
max_replication_slots = 10  # số slot replication tối đa (mỗi connector thường 1 slot)
max_wal_senders = 10  # số process gửi WAL tối đa
max_slot_wal_keep_size = '64MB'  # WAL tối đa giữ cho mỗi slot
