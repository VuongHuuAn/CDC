name: setup-v1-3vm
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports: ['192.168.139.164:18123:8123', '192.168.139.164:19000:9000']
    volumes:
    - ../../clickhouse:/clickhouse:ro
    - ../../data/clickhouse:/var/lib/clickhouse
    - ../../clickhouse/init.sql:/docker-entrypoint-initdb.d/10-outbox.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'wget --spider -q http://127.0.0.1:8123/ping']
      interval: 5s
      retries: 30
